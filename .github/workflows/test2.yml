name: Tufuwu/test2
on:
  push:
    branches:
    - "**/*"
  pull_request:
concurrency:
#   # This item has no matching transformer
#   maximum_number_of_builds: 0
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - run: gem install bundler
    - run: bundle install --jobs=3 --retry=3
    - run: wget -O ${PWD}/tests/test.sh https://gist.githubusercontent.com/nickjj/d12353b5b601e33cd62fda111359957a/raw
    - run: chmod +x ${PWD}/tests/test.sh
    - run: "${PWD}/tests/test.sh"
    strategy:
      matrix:
        distro:
        - ubuntu1804
        - ubuntu2004
        - debian9
        - debian10
    services:
#       # This item has no matching transformer
#       docker:
    env:
      DISTRO: "${{ matrix.distro }}"
