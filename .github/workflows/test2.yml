name: Tufuwu/test2
on:
  push:
    branches:
    - "**/*"
  pull_request:
concurrency:
#   # This item has no matching transformer
#   maximum_number_of_builds: 0
env:
  CFLAGS: "$CFLAGS -g"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - uses: actions/setup-python@v5.0.0
      with:
        python-version: "${{ matrix.python }}"
    - name: Set up pip cache
      uses: actions/cache@v3.3.2
      with:
        path: "~/.cache/pip"
        key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}"
        restore-keys: "${{ runner.os }}-pip-"
#     # 'sudo' was not transformed because there is no suitable equivalent in GitHub Actions
    - run: pip install -r requirements.txt
    - run: pip install -U tox-travis virtualenv
    - run: if [[ -n "${LUA##bundle}" ]]; then sudo apt-get install lib${LUA}-dev ; fi
    - run: if [[ -z "${LUA##lua5*}" ]]; then export SETUP_OPTIONS="--no-luajit" ; fi
    - run: if [[ "$LUA" == "bundle" ]]; then export SETUP_OPTIONS="--use-bundle" ; fi
    - run: if [[ "$LUA" == "bundle" ]]; then export CFLAGS="$CFLAGS -flto" ; export LDFLAGS="$LDFLAGS -flto" ; fi
    - run: tox
    strategy:
      matrix:
        LUA:
        - luajit-5.1
        - lua5.3
        - lua5.2
        - bundle
        python:
        - 3.8
        - 2.7
        - 3.7
        - 3.6
        - 3.5
#       # 'allow_failures' transformations are currently unsupported.
    env:
      LUA: "${{ matrix.LUA }}"
