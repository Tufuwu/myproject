  Python_3_5_on_macOS:
    runs-on: ubuntu-16.04
    env:
      TOXENV: py35
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - run: apt-get -y install lsof
#     # 'version' was not transformed because there is no suitable equivalent in GitHub Actions
    - run: unset PYENV_ROOT
    - run: curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
    - run: export PATH="${{ github.workspace }}/.pyenv/bin:$PATH"
    - run: eval "$(pyenv init -)"
    - run: pyenv install --skip-existing 3.5.10
    - run: pyenv global 3.5.10
    - run: python3 -m pip install --upgrade pip tox
    - run: python3 -m tox
    services:
