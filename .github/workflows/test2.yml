name: Tufuwu/test2
on:
  push:
    branches:
    - "**/*"
  pull_request:
concurrency:
#   # This item has no matching transformer
#   maximum_number_of_builds: 0
jobs:
  test:
    runs-on: ubuntu-16.04
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Set up cache
      uses: actions/cache@v3.3.2
      with:
        path: |-
          ${{ github.workspace }}/geosinstall
          ~/.cache/pip
        key: "${{ runner.os }}-path"
    - run: export GEOS_INSTALL=${{ github.workspace }}/geosinstall/geos-$GEOS_VERSION
    - run: "./ci/install_geos.sh"
    - run: pip install --disable-pip-version-check --upgrade pip
    - run: pip install --upgrade wheel
    - run: if [ "$SPEEDUPS" == "1" ]; then pip install --install-option="--no-cython-compile" cython; fi
    - run: if [ "$NUMPY" == "0" ]; then pip uninstall --yes numpy; fi
    - run: if [ "$SPEEDUPS" == "1" ]; then SPEEDUPS_FLAG=--with-speedups; else SPEEDUPS_FLAG=--without-speedups; fi
    - run: pip install --upgrade coveralls pytest-cov pytest>=3.8
    - run: export GEOS_CONFIG=${{ github.workspace }}/geosinstall/geos-$GEOS_VERSION/bin/geos-config
    - run: pip install -v -e .[all]
    - run: export LD_LIBRARY_PATH=${{ github.workspace }}/geosinstall/geos-$GEOS_VERSION/lib
    - run: export DYLD_LIBRARY_PATH=${{ github.workspace }}/geosinstall/geos-$GEOS_VERSION/lib
    - run: python -c "from shapely.geos import geos_version; print(geos_version)"
    - run: python -m pytest --cov shapely --cov-report term-missing "${SPEEDUPS_FLAG}"
    - run: if [[ "$TRAVIS_PYTHON_VERSION" == "3.8" && "$NUMPY" == "1" && "$SPEEDUPS" == "1" ]]; then python -m pytest shapely --doctest-modules; fi
    - run: coveralls || echo "!! intermittent coveralls failure"
      if: "${{ success() }}"
#     # This item has no matching transformer
#     - email: false
    strategy:
      matrix: {}
#       # 'allow_failures' transformations are currently unsupported.
